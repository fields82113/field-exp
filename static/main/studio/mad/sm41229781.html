    <p>Journey(BEMANI) × 常磐線サイクルトレイン<br>
      常磐線サイクルトレインは数年間にわたって団体臨時列車として実証実験のような形で運転されてきた。車両は毎回E531系が充当された。上野駅を出発し、主に土浦と岩瀬を結ぶつくば霞ヶ浦りんりんロード（筑波鉄道廃線跡）へのサイクリング向けに運転されたものをMAD化したものである。<br>
      土浦駅はサイクリストに優しい動線が施されていて拠点としての施設も充実している。BEB5（星野リゾート）はいつか泊まりに行きたいところ。
    </p>
