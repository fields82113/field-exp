    <h2>ふくしま浜通りサイクルトレインで行く復興サイクリング</h2>
    <img src="thumb/sm46325769.jpg" alt="vol.3">
    <p>
      常磐線サイクルトレインはついに福島の浜通りへ。ふくしま浜通りサイクルルートがナショナルサイクルルートに内定（現在は決定済み）したのを記念してE501 SAKIGAKEでサイクルトレインが運行され、同時にこの区間の普通列車がサイクルトレインとして解放。ゲストライダー<a href="https://www.youtube.com/channel/UCsXNSJ3Nq082qv4MTVq7huA" target="_blank">あむちゃん</a>を迎え、あいにくの悪天候の中の浜通りを駆け抜ける。<br>
      そして涙雨をに嘆くかのようにそびえる福島第一原発と鉄塔群を見る。
    </p>
