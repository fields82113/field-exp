    <p>
      路線は鉄道やバスだけじゃなく鉄塔にもある。そして送電線の路線の中には鉄道路線と同じ名前のものもあります。そのひとつが東電の千代田線。<br>
      千代田線は住宅街から都内へ向けて路線を伸ばしていくが、その先には何があるのか。そして終点はどこなのかをサイクリングで追っていきます。
