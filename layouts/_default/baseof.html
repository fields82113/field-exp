<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><!-- 他のページと同じ値にする -->
  <title>{{ .Title }}｜{{ site.Title }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/default.css">
  <link rel="stylesheet" href="/assets/css/default_sp.css" media="(max-width: 767px)"> 
</head>
<body>
  <div id="tile_scroll_enable">
    {{ partial "header.html" . }}
    {{ block "main" . }}{{ end }}
  </div>

<dialog id="zoom" class="zoom_dialog"><img alt=""></dialog>
<script src="/assets/js/zoom.js" defer></script>

</body>
</html>
