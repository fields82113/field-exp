<a href="/" id="topbtn">
  <img src="/img/topbutton.png" alt="トップページへ">
</a>
{{ with .CurrentSection }}
<div id="header">
  <div id="to_left">
    <a href="{{ .Params.prev_url }}" rel="prev" aria-label="前のページ：{{ .Params.prev_label }}"></a>
  </div>
  <div id="titlebar">
    <div class="sectiontitle">{{ .Params.sectiontitle | default .Title }}</div>
  </div>
  <div id="to_right">
    <a href="{{ .Params.next_url }}" rel="next" aria-label="次のページ：{{ .Params.next_label }}"></a>
  </div>
</div>
{{ end }}
